<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Battles - Eniacs Battle World</title>

  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.11/dist/htmx.min.js" integrity="sha384-0gxUXCCR8yv9FM2b+U3FDbsKthCI66oH5IA9fHppQq9DDMHuMauqq1ZHBpJxQ0J0" crossorigin="anonymous"></script>
</head>
<body>
  <nav class="nav">
    <span class="nav-brand">Eniacs Battle World</span>
    <ul class="nav-links">
      <li><a href="/web/app/village">My Village</a></li>
      <li><a href="/web/app/shop">Shop</a></li>
      <li><a href="/web/app/battles" class="active">Battles</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="section-header">
      <h2>Find Opponents</h2>
    </div>

    <div class="card">
      <table class="stats-table">
        <thead>
          <tr>
            <th>Owner</th>
            <th>Village Level</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {{range .Opps}}
          <tr>
            <td>{{.Username}}</td>
            <td><span class="badge badge-level">Lv {{.VillageLevel}}</span></td>
            <td>
              <a href="/web/app/battle/{{.ID}}" class="btn btn-danger btn-sm">Attack</a>
            </td>
          </tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
